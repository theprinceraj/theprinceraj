name: Update README cards

on:
  schedule:
    - cron: "17 0,12 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-cards
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Download SVGs
        run: |
          mkdir -p dynamic-cards
          jq -r 'to_entries[] | "\(.key) \(.value)"' dynamic-cards.json | while read -r name url; do
            tmp=$(mktemp)
            if curl -fsSL --retry 3 "$url" -o "$tmp" && grep -q '<svg' "$tmp"; then
              mv "$tmp" "dynamic-cards/${name}.svg"
            else
              echo "::warning::Skipped ${name} (${url})"
            fi
          done

      - name: Commit if changed
        run: |
          git config user.name "theprinceraj[bot]"
          git config user.email "no-reply@theprinceraj.in"
          git add dynamic-cards
          git diff --cached --quiet || git commit -m "Timely Readme Card Updates"
          git push
